name: New fpds search fields PR

on:
  schedule:
     - cron: "0 0 * * *"
  pull_request: # TODO: fully remove once done testing
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: nanasess/setup-chromedriver@v2

      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - uses: extractions/setup-just@v3
        with:
          just-version: 1.46.0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.13

      - name: Scrape FPDS Site
        run: just scrape

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "minor: updating fields.json with newly identified ezSearch fields"
          title: "minor: 🤖 [AUTOMATED] new ezSearch fields"
          body: |
            Automated updates from FPDS ezSearch scraper.

            Reference the following [data dictionary](https://www.fpds.gov/downloads/Version_1.5_specs/FPDS_DataDictionary_V1.5.pdf)
            for field descriptions and regex patterns. This is a bit of a pain since
            it is a manual process.

            **Checklist**
            - [ ] Updated field description
            - [ ] Updated field regex

          branch: minor/new-ezsearch-fields
          base: master
          labels: automated, feature
          draft: false
